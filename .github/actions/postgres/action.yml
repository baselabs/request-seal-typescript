name: Platform PostgreSQL
description: Start or remove this job's disposable platform PostgreSQL engine
inputs:
  mode:
    description: start or stop
    required: false
    default: start
runs:
  using: composite
  steps:
    - name: Check the public platform engine and pull its digest
      if: inputs.mode == 'start'
      shell: bash
      run: |
        engine="$(cat .github/postgres.ref)"
        [[ "$engine" =~ ^ghcr\.io/baselabs/postgres:[0-9]+\.[0-9]+-inputs-[0-9a-f]{64}@sha256:[0-9a-f]{64}$ ]]
        current_digest="$(python3 - <<'PY'
        import json, re, urllib.request
        host, path = 'ghcr.io', 'baselabs/postgres'
        with urllib.request.urlopen(f'https://{host}/token?scope=repository:{path}:pull', timeout=30) as response:
            token = json.load(response)['token']
        request = urllib.request.Request(f'https://{host}/v2/{path}/manifests/current', method='HEAD', headers={
            'Authorization': 'Bearer ' + token,
            'Accept': ', '.join(('application/vnd.oci.image.index.v1+json', 'application/vnd.oci.image.manifest.v1+json',
                                 'application/vnd.docker.distribution.manifest.list.v2+json',
                                 'application/vnd.docker.distribution.manifest.v2+json'))})
        with urllib.request.urlopen(request, timeout=30) as response:
            digest = response.headers.get('Docker-Content-Digest', '')
        if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
            raise SystemExit('ghcr.io/baselabs/postgres:current: registry named no digest')
        print(digest)
        PY
        )"
        if [ "${engine##*@}" != "$current_digest" ]; then
          echo 'checked PostgreSQL digest differs from ghcr.io/baselabs/postgres:current' >&2; exit 1
        fi
        docker pull "$engine"
    - name: Start the disposable PostgreSQL server
      if: inputs.mode == 'start'
      shell: bash
      run: |
        set -euo pipefail
        container="rs-postgres-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
        # The workflow env names the fixture values; docker reads them from the environment.
        [ -n "${TEST_PG_USER:-}" ] && [ -n "${TEST_PG_PASSWORD:-}" ] && [ -n "${TEST_PG_DATABASE:-}" ] && [ -n "${REQUESTSEAL_REPLAY_PG_URL:-}" ] || {
          echo "::error::TEST_PG_USER, TEST_PG_PASSWORD, TEST_PG_DATABASE and REQUESTSEAL_REPLAY_PG_URL are required"; exit 1; }
        engine="$(cat .github/postgres.ref)"
        docker run --detach --pull=never --name "$container" \
          --publish 127.0.0.1:15432:5432 \
          --tmpfs /var/lib/pg:uid=26,gid=26,mode=0750 --tmpfs /tmp \
          --env TEST_PG_USER --env TEST_PG_PASSWORD --env TEST_PG_DATABASE \
          --entrypoint baselabs-test-postgres "$engine"
        ready=false
        for ((attempt=0; attempt<60; attempt++)); do
          if docker exec "$container" pg_isready -h 127.0.0.1 -U "$TEST_PG_USER" -d "$TEST_PG_DATABASE"; then
            ready=true
            break
          fi
          sleep 1
        done
        if [ "$ready" != true ]; then
          docker logs "$container"
          echo "::error::PostgreSQL did not become ready within 60 attempts"
          exit 1
        fi
    # Log, then remove, on every outcome: the server log carries only fixture values.
    - name: Remove the disposable PostgreSQL server
      if: always() && inputs.mode == 'stop'
      shell: bash
      run: |
        set -euo pipefail
        container="rs-postgres-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
        if docker container inspect "$container" > /dev/null 2>&1; then
          docker logs "$container"
          docker rm -f -v "$container"
        fi
