name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  node:
    name: Node ${{ matrix.node == '26.11.1' && '26' || matrix.node }}
    runs-on: ubuntu-24.04
    services:
      # Trust authentication and the passwordless URL are for this ephemeral runner only.
      postgres:
        image: postgres:18@sha256:885953109528ad3dfc90362b1a6f50a78620b5315be19f187753d267e484dc5b # Linux amd64
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: requestseal_replay
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        # 22.23.1 is a common 22.x developer default; its tls.checkServerIdentity cannot match IPv6 literals.
        node: ['22.12.0', '22.23.1', '24.21.0', '26.11.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      # setup-node has no version-type input. Assert strict equality for exact lanes.
      - name: Assert the installed Node version
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          node -e 'const expected=process.env.EXPECTED_NODE; const actual=process.versions.node; if (actual!==expected) process.exit(1); console.log(actual)'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix interop --ignore-scripts
      - run: npm ci --prefix interop/adapters --ignore-scripts
      - run: npm ci --prefix interop/migration --ignore-scripts
      - run: node --experimental-strip-types --no-warnings --test interop/migration/claims.test.ts
      # The ubuntu-24.04 runner image supplies the required OpenSSH client tools.
      - run: command -v ssh-agent ssh-keygen ssh-add && ssh -V
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '29.0.3'
          elixir-version: '1.20.3'
      - name: Reextract the pinned Elixir error vocabulary
        run: |
          git clone --depth 1 --branch v0.4.1 https://github.com/baselabs/request_seal.git "$RUNNER_TEMP/request-seal-reference"
          test "$(git -C "$RUNNER_TEMP/request-seal-reference" rev-parse HEAD)" = 0a6568aa246326617f760e94e21b359285c6ddfc
          node --experimental-strip-types --no-warnings --test test/extract-elixir-reasons.ts
        env:
          REQUEST_SEAL_REPO: ${{ runner.temp }}/request-seal-reference
      - name: Prove the test runner rejects a failure
        run: |
          sh scripts/red-proof.sh npm run test:red
      - run: npm run check
        env:
          REQUESTSEAL_REPLAY_PG_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/requestseal_replay
      - run: npm run docs
      # High-severity audit findings block. Adjudicate each finding before changing this gate.
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
  native:
    name: ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    services:
      # Trust authentication and the passwordless URL are for this ephemeral runner only.
      postgres:
        image: postgres:18@sha256:885953109528ad3dfc90362b1a6f50a78620b5315be19f187753d267e484dc5b # Linux amd64
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: requestseal_replay
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: '2.5.6'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.runtime == 'bun'
        with:
          bun-version: '1.3.14'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix interop --ignore-scripts
      - run: npm ci --prefix interop/adapters --ignore-scripts
      - run: command -v ssh-agent ssh-keygen ssh-add && ssh -V
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '29.0.3'
          elixir-version: '1.20.3'
      - name: Prove Deno rejects a failure
        if: matrix.runtime == 'deno'
        run: |
          sh scripts/red-proof.sh deno test --allow-read test/red/planted.test.ts
      - name: Prove Bun rejects a failure
        if: matrix.runtime == 'bun'
        run: |
          sh scripts/red-proof.sh bun test test/red/planted.test.ts
      - run: npm run typecheck && npm run typecheck:web
      - run: npm run build
      - name: Deno core tests and conformance
        env:
          REQUESTSEAL_REPLAY_PG_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/requestseal_replay
        if: matrix.runtime == 'deno'
        run: |
          deno test --no-check --allow-read --allow-write --allow-env --allow-net --allow-run=deno,node,npm,sh,gh,git,openssl,cc,pkg-config,elixir,mix,ssh-agent,ssh-keygen,ssh-add test/*.test.ts
          deno run --allow-read tools/conformance/cli.ts --corpus test/fixtures/corpus-smoke --smoke
          deno run --allow-read tools/conformance/cli.ts --corpus conformance --pending-ok
      # Bun 1.3.14 --isolate intermittently recreates stdio with epoll_ctl EEXIST on Linux.
      - name: Bun core tests and conformance
        env:
          REQUESTSEAL_REPLAY_PG_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/requestseal_replay
        if: matrix.runtime == 'bun'
        run: |
          bun test --timeout 30000 test/*.test.ts
          bun run tools/conformance/cli.ts --corpus test/fixtures/corpus-smoke --smoke
          bun run tools/conformance/cli.ts --corpus conformance --pending-ok
      - run: npm run self-checks && npm run build && npm run pack:check
      # Findings block this lane until individually adjudicated.
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
  os-trust-denied:
    name: Deno denied OS roots
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.7'
      - name: Refuse OS roots without system permission
        env:
          REQUEST_SEAL_EXPECT_DENIED_ROOTS: '1'
        run: deno test --no-check --allow-read --allow-env=REQUEST_SEAL_EXPECT_DENIED_ROOTS test/discovery-os-trust.test.ts
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix interop/browser --ignore-scripts
      - run: npm audit --prefix interop/browser --audit-level=high
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: interop/browser
      - run: npm run build
      - run: npm run build --prefix interop/browser
      - run: npm test --prefix interop/browser
      - name: Prove every browser rejects a failure
        run: sh scripts/red-proof.sh npm run test:red --prefix interop/browser
  reciprocal:
    name: reciprocal
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    services:
      # Trust authentication and the passwordless URL are for this ephemeral runner only.
      postgres:
        image: postgres:18@sha256:885953109528ad3dfc90362b1a6f50a78620b5315be19f187753d267e484dc5b
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: requestseal_replay
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      REQUESTSEAL_REPLAY_ELIXIR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '29.0.3'
          elixir-version: '1.20.3'
      - run: elixir --version
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix interop --ignore-scripts
      - run: npm ci --prefix interop/reciprocal --ignore-scripts
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked && mix compile --warnings-as-errors
        working-directory: interop/elixir
      - run: mix deps.get --check-locked && mix compile --warnings-as-errors
        working-directory: interop/replay
      - run: npm run typecheck --prefix interop/reciprocal
      - run: node --experimental-strip-types --no-warnings --test test/peer-process.test.ts test/replay-reciprocal.test.ts test/reciprocal.test.ts test/reciprocal-driver.test.ts test/reciprocal-record.test.ts
        env:
          REQUESTSEAL_REPLAY_PG_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/requestseal_replay
      - run: npm run exchange --prefix interop/reciprocal
        env:
          REQUESTSEAL_REPLAY_PG_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/requestseal_replay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reciprocal-exchange
          retention-days: 3
          path: interop/reciprocal/.cache/exchange.jsonl
