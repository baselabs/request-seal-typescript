name: CI
on:
  push:
    branches: ['kci/**']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  toolchains:
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 44376795843: cold job 10s; no cache restored.
    outputs:
      nodes: ${{ steps.matrix.outputs.nodes }}
      native: ${{ steps.matrix.outputs.native }}
      node: ${{ steps.versions.outputs.nodejs }}
      npm: ${{ steps.manager.outputs.npm }}
      deno_os_trust: ${{ steps.matrix.outputs.deno_os_trust }}
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      python: ${{ steps.versions.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the shared toolchain reader
        run: scripts/toolchain.sh --self-test
      - name: Read exact tool versions
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: Refuse a different Python version
        env:
          EXPECTED_PYTHON: ${{ steps.versions.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - name: Check workflow toolchain contracts
        run: python3 -I -B -m unittest discover -s test -p 'toolchain_test.py'
      - name: Read the declared package manager
        id: manager
        run: python3 -I -B scripts/package-manager.py >> "$GITHUB_OUTPUT"
      - name: Compose runtime matrices from shared outputs
        id: matrix
        env:
          NODEJS: ${{ steps.versions.outputs.nodejs }}
          NODEJS_LANES: ${{ steps.versions.outputs.nodejs_lanes }}
          DENO: ${{ steps.versions.outputs.deno }}
          DENO_LANES: ${{ steps.versions.outputs.deno_lanes }}
          BUN: ${{ steps.versions.outputs.bun }}
        run: |
          python3 -I -B - >> "$GITHUB_OUTPUT" <<'PYTHON'
          import json, os
          matrices = {
              'nodes': [os.environ['NODEJS'], *json.loads(os.environ['NODEJS_LANES'])],
              'native': [{'runtime': 'deno', 'version': os.environ['DENO']},
                         {'runtime': 'bun', 'version': os.environ['BUN']}],
              'deno_os_trust': json.loads(os.environ['DENO_LANES']),
          }
          for name, value in matrices.items():
              print(f'{name}={json.dumps(value, separators=(",", ":"))}')
          PYTHON
  node:
    needs: toolchains
    timeout-minutes: 8 # Run 44376795843: slowest cold Node lane 215s; no cache restored.
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    env:
      # Throwaway fixture values for this job's disposable platform PostgreSQL, never service credentials.
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
      TEST_PG_DATABASE: requestseal_replay
      REQUESTSEAL_REPLAY_PG_URL: postgresql://postgres:postgres@127.0.0.1:15432/requestseal_replay
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.toolchains.outputs.nodes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ needs.toolchains.outputs.python }}
      - name: Refuse a different Python version
        env:
          EXPECTED_PYTHON: ${{ needs.toolchains.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - uses: ./.github/actions/postgres
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
          check-latest: true
      - name: Refuse a different Node version
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"
      - name: Install the declared package manager
        env:
          EXPECTED_NPM: ${{ needs.toolchains.outputs.npm }}
        run: |
          npm install --global "npm@$EXPECTED_NPM" --ignore-scripts
          test "$(npm --version)" = "$EXPECTED_NPM"
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix interop --ignore-scripts
      - run: npm audit --prefix interop --audit-level=high
      - run: npm ci --prefix interop/adapters --ignore-scripts
      - run: npm audit --prefix interop/adapters --audit-level=high
      - run: npm ci --prefix interop/migration --ignore-scripts
      - run: npm audit --prefix interop/migration --audit-level=high
      - run: node --experimental-strip-types --no-warnings --test interop/migration/claims.test.ts
      # The ubuntu-24.04 runner image supplies the required OpenSSH client tools.
      - run: command -v ssh-agent ssh-keygen ssh-add && ssh -V
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ needs.toolchains.outputs.elixir }}
          otp-version: ${{ needs.toolchains.outputs.otp }}
          version-type: strict
      - name: Refuse different Elixir or OTP versions
        env:
          EXPECTED_ELIXIR: ${{ needs.toolchains.outputs.elixir }}
          EXPECTED_OTP: ${{ needs.toolchains.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"
      - name: Reextract the pinned Elixir error vocabulary
        run: |
          git init "$RUNNER_TEMP/request-seal-reference"
          git -C "$RUNNER_TEMP/request-seal-reference" fetch --depth 1 https://github.com/baselabs/request_seal.git 511fed142044ccea28bdcbb317c091cb2c8a515d
          git -C "$RUNNER_TEMP/request-seal-reference" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/request-seal-reference" rev-parse HEAD)" = 511fed142044ccea28bdcbb317c091cb2c8a515d
          node --experimental-strip-types --no-warnings --test test/extract-elixir-reasons.ts
        env:
          REQUEST_SEAL_REPO: ${{ runner.temp }}/request-seal-reference
      - name: Prove the test runner rejects a failure
        run: |
          bash scripts/red-proof.sh npm run test:red
      - run: npm run check
      - run: npm run docs
      # High-severity audit findings block. Adjudicate each finding before changing this gate.
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
      - uses: ./.github/actions/postgres
        if: always()
        with:
          mode: stop
  native:
    needs: toolchains
    timeout-minutes: 9 # Run 44221651870: slowest cold lane, Deno 261s; run 44376795843: cold Bun 236s; no cache restored.
    name: ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    env:
      # Throwaway fixture values for this job's disposable platform PostgreSQL, never service credentials.
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
      TEST_PG_DATABASE: requestseal_replay
      REQUESTSEAL_REPLAY_PG_URL: postgresql://postgres:postgres@127.0.0.1:15432/requestseal_replay
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.toolchains.outputs.native) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ needs.toolchains.outputs.python }}
      - name: Refuse a different Python version
        env:
          EXPECTED_PYTHON: ${{ needs.toolchains.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - uses: ./.github/actions/postgres
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.toolchains.outputs.node }}
          package-manager-cache: false
      - name: Refuse a different Node version
        env:
          EXPECTED_NODE: ${{ needs.toolchains.outputs.node }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: ${{ matrix.version }}
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.runtime == 'bun'
        with:
          bun-version: ${{ matrix.version }}
          no-cache: true
      - name: Refuse a different native runtime version
        env:
          EXPECTED_RUNTIME: ${{ matrix.runtime }}
          EXPECTED_VERSION: ${{ matrix.version }}
        run: scripts/toolchain.sh --installed "$EXPECTED_RUNTIME=$EXPECTED_VERSION"
      - name: Install the declared package manager
        env:
          EXPECTED_NPM: ${{ needs.toolchains.outputs.npm }}
        run: |
          npm install --global "npm@$EXPECTED_NPM" --ignore-scripts
          test "$(npm --version)" = "$EXPECTED_NPM"
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix interop --ignore-scripts
      - run: npm audit --prefix interop --audit-level=high
      - run: npm ci --prefix interop/adapters --ignore-scripts
      - run: npm audit --prefix interop/adapters --audit-level=high
      - run: command -v ssh-agent ssh-keygen ssh-add && ssh -V
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ needs.toolchains.outputs.elixir }}
          otp-version: ${{ needs.toolchains.outputs.otp }}
          version-type: strict
      - name: Refuse different Elixir or OTP versions
        env:
          EXPECTED_ELIXIR: ${{ needs.toolchains.outputs.elixir }}
          EXPECTED_OTP: ${{ needs.toolchains.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"
      - name: Prove Deno rejects a failure
        if: matrix.runtime == 'deno'
        run: |
          # setup-python exports LD_LIBRARY_PATH; Deno refuses subprocesses under a scoped
          # --allow-run while it is set, and nothing Deno starts here needs it.
          unset LD_LIBRARY_PATH
          bash scripts/red-proof.sh deno test --allow-read test/red/planted.test.ts
      - name: Prove Bun rejects a failure
        if: matrix.runtime == 'bun'
        run: |
          bash scripts/red-proof.sh bun test test/red/planted.test.ts
      - run: npm run typecheck && npm run typecheck:web
      - run: npm run build
      - name: Deno core tests and conformance
        if: matrix.runtime == 'deno'
        run: |
          # setup-python exports LD_LIBRARY_PATH; Deno refuses subprocesses under a scoped
          # --allow-run while it is set, and nothing Deno starts here needs it.
          unset LD_LIBRARY_PATH
          deno test --no-check --allow-read --allow-write --allow-env --allow-net --allow-run=deno,node,npm,bash,sh,gh,git,openssl,cc,pkg-config,elixir,mix,ssh-agent,ssh-keygen,ssh-add,scripts/toolchain.sh test/*.test.ts
          deno run --allow-read tools/conformance/cli.ts --corpus test/fixtures/corpus-smoke --smoke
          deno run --allow-read tools/conformance/cli.ts --corpus conformance
      # Bun --isolate intermittently recreates stdio with epoll_ctl EEXIST on Linux.
      - name: Bun core tests and conformance
        if: matrix.runtime == 'bun'
        run: |
          bun test --timeout 30000 test/*.test.ts
          bun run tools/conformance/cli.ts --corpus test/fixtures/corpus-smoke --smoke
          bun run tools/conformance/cli.ts --corpus conformance
      - run: npm run self-checks && npm run build && npm run pack:check
      # Findings block this lane until individually adjudicated.
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
      - uses: ./.github/actions/postgres
        if: always()
        with:
          mode: stop
  os-trust-denied:
    needs: toolchains
    name: Deno ${{ matrix.deno }} denied OS roots
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 44202576403: cold job 15s; no cache restored.
    strategy:
      fail-fast: false
      matrix:
        deno: ${{ fromJSON(needs.toolchains.outputs.deno_os_trust) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno }}
          cache: false
      - name: Refuse a different Deno version
        env:
          EXPECTED_DENO: ${{ matrix.deno }}
        run: scripts/toolchain.sh --installed "deno=$EXPECTED_DENO"
      - name: Refuse OS roots without system permission
        env:
          REQUEST_SEAL_EXPECT_DENIED_ROOTS: '1'
        run: deno test --no-check --allow-read --allow-env=REQUEST_SEAL_EXPECT_DENIED_ROOTS test/discovery-os-trust.test.ts
  browsers:
    runs-on: ubuntu-24.04
    needs: toolchains
    timeout-minutes: 5 # Run 44212181768: cold job 62s in the pinned Playwright image; no cache restored.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    env:
      HOME: /root # Firefox requires the current user's home in a root container.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.toolchains.outputs.node }}
          package-manager-cache: false
      - name: Refuse a different Node version
        env:
          EXPECTED_NODE: ${{ needs.toolchains.outputs.node }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"
      - name: Install the declared package manager
        env:
          EXPECTED_NPM: ${{ needs.toolchains.outputs.npm }}
        run: |
          npm install --global "npm@$EXPECTED_NPM" --ignore-scripts
          test "$(npm --version)" = "$EXPECTED_NPM"
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix interop/browser --ignore-scripts
      - run: npm audit --prefix interop/browser --audit-level=high
      - name: Refuse a different Playwright version
        working-directory: interop/browser
        run: |
          expected="1.64.1"
          actual="$(node -p 'require("playwright/package.json").version')"
          test "$actual" = "$expected" || { echo "::error::Installed Playwright $actual differs from container image Playwright $expected; update the lockfile and image together"; exit 1; }
      - run: npm run build
      - run: npm run build --prefix interop/browser
      - run: npm test --prefix interop/browser
      - name: Prove every browser rejects a failure
        run: bash scripts/red-proof.sh npm run test:red --prefix interop/browser
  reciprocal:
    needs: toolchains
    name: reciprocal
    timeout-minutes: 11 # Run 44215270545: cold job 325s; no cache restored.
    runs-on: ubuntu-24.04
    env:
      REQUESTSEAL_REPLAY_ELIXIR: '1'
      # Throwaway fixture values for this job's disposable platform PostgreSQL, never service credentials.
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
      TEST_PG_DATABASE: requestseal_replay
      REQUESTSEAL_REPLAY_PG_URL: postgresql://postgres:postgres@127.0.0.1:15432/requestseal_replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ needs.toolchains.outputs.python }}
      - name: Refuse a different Python version
        env:
          EXPECTED_PYTHON: ${{ needs.toolchains.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - uses: ./.github/actions/postgres
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.toolchains.outputs.node }}
          package-manager-cache: false
      - name: Refuse a different Node version
        env:
          EXPECTED_NODE: ${{ needs.toolchains.outputs.node }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ needs.toolchains.outputs.elixir }}
          otp-version: ${{ needs.toolchains.outputs.otp }}
          version-type: strict
      - name: Refuse different Elixir or OTP versions
        env:
          EXPECTED_ELIXIR: ${{ needs.toolchains.outputs.elixir }}
          EXPECTED_OTP: ${{ needs.toolchains.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"
      - name: Install the declared package manager
        env:
          EXPECTED_NPM: ${{ needs.toolchains.outputs.npm }}
        run: |
          npm install --global "npm@$EXPECTED_NPM" --ignore-scripts
          test "$(npm --version)" = "$EXPECTED_NPM"
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix interop --ignore-scripts
      - run: npm audit --prefix interop --audit-level=high
      - run: npm ci --prefix interop/reciprocal --ignore-scripts
      - run: npm audit --prefix interop/reciprocal --audit-level=high
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked && mix hex.audit && mix deps.audit && mix compile --warnings-as-errors
        working-directory: interop/elixir
      - run: mix deps.get --check-locked && mix hex.audit && mix deps.audit && mix compile --warnings-as-errors
        working-directory: interop/replay
      - run: npm run typecheck --prefix interop/reciprocal
      - run: node --experimental-strip-types --no-warnings --test test/peer-process.test.ts test/replay-reciprocal.test.ts test/reciprocal.test.ts test/reciprocal-driver.test.ts test/reciprocal-record.test.ts
      - run: npm run exchange --prefix interop/reciprocal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reciprocal-exchange
          retention-days: 7
          path: interop/reciprocal/.cache/exchange.jsonl
      - uses: ./.github/actions/postgres
        if: always()
        with:
          mode: stop
  qualified:
    if: always()
    needs: [toolchains, node, native, os-trust-denied, browsers, reciprocal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 44226062526: cold job 6s; no cache restored.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ needs.toolchains.outputs.python }}
      - name: Refuse a different Python version
        env:
          EXPECTED_PYTHON: ${{ needs.toolchains.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - name: Require every qualification job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['NEEDS_JSON'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Qualification failed: {failed}')
          PYTHON
