name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  # The reusable CI workflow includes the required reciprocal job.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Install the trusted-publishing npm toolchain
        run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      # The verify job above runs the complete CI battery on this exact commit.
      # This job builds the artifact it stages and checks that artifact.
      - run: npm run build
      - run: npm run pack:check
      - name: Require complete release corpus coverage
        run: node --experimental-strip-types --no-warnings tools/conformance/cli.ts --corpus conformance
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
      - name: Check the tag and registry version
        id: existing
        run: node --experimental-strip-types --no-warnings scripts/registry-check.ts
      # Trusted publishing stages the artifact; approval on npmjs.com makes it live.
      - name: Stage the verified package with provenance
        if: steps.existing.outputs.published == 'false'
        run: npm stage publish --provenance
