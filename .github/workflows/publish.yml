name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the inspected archive with provenance
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    environment: publish
    outputs:
      published: ${{ steps.readback.outputs.published }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse a ref outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read exact tool versions
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: Refuse a different Python version
        env:
          EXPECTED_PYTHON: ${{ steps.versions.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - name: Read the declared package manager
        id: manager
        run: python3 -I -B scripts/package-manager.py >> "$GITHUB_OUTPUT"
      - name: Set up Node from the tool versions
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          package-manager-cache: false
      - name: Refuse a different Node version
        env:
          EXPECTED_NODE: ${{ steps.versions.outputs.nodejs }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"
      - name: Install the declared package manager
        env:
          EXPECTED_NPM: ${{ steps.manager.outputs.npm }}
        run: |
          npm install --global "npm@$EXPECTED_NPM" --ignore-scripts
          test "$(npm --version)" = "$EXPECTED_NPM"
      - name: Install with the frozen lockfile
        run: npm ci --ignore-scripts
      - name: Refuse a package name the registry has never had
        run: node --experimental-strip-types --no-warnings scripts/registry-check.ts existing
      - name: Refuse an already-tagged version
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          const tags = execFileSync('git', ['ls-remote', '--tags', 'origin', `refs/tags/v${version}`, `refs/tags/v${version}^{}`], {encoding: 'utf8'});
          assert.equal(tags.trim(), '', `v${version} is already tagged`);
          JAVASCRIPT
      - name: Build the library and documentation
        run: |
          npm run build
          npm run docs
      - name: Pack the package archive
        run: |
          mkdir -p artifacts
          npm pack --json --ignore-scripts --pack-destination artifacts > artifacts/pack.json
          cp CHANGELOG.md artifacts/CHANGELOG.md
      - name: Inspect the exact package archive
        id: inspect
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, tarfile
          from pathlib import Path, PurePosixPath
          source = json.loads(Path('package.json').read_text())
          metadata = json.loads(Path('artifacts/pack.json').read_text())
          archive = Path('artifacts') / metadata[0]['filename'] if isinstance(metadata, list) else Path(metadata['file'])
          assert archive.resolve().parent == Path('artifacts').resolve(), 'archive must be in artifacts'
          target = Path('artifacts/package.tgz')
          archive.rename(target)
          allowed = set(source['files']) | {'package.json', 'README.md', 'LICENSE', 'NOTICE'}
          with tarfile.open(target, 'r:gz') as package:
              members = package.getmembers()
              paths = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts, f'unsafe path: {path}'
                  assert path.parts[0] == 'package', f'unexpected archive root: {path}'
                  if member.isdir():
                      continue
                  assert member.isfile(), f'non-regular archive member: {path}'
                  relative = str(path.relative_to('package'))
                  assert relative in allowed or any(relative.startswith(entry.rstrip('/') + '/') for entry in allowed), f'unexpected packed file: {relative}'
                  assert relative not in paths, f'duplicate packed file: {relative}'
                  paths.add(relative)
              packed = json.load(package.extractfile('package/package.json'))
          assert (packed['name'], packed['version']) == (source['name'], source['version']), 'package identity differs'
          assert packed.get('publishConfig', {}).get('access') == 'public', 'package must be public'
          assert {'package.json', 'README.md', 'LICENSE', 'NOTICE'} <= paths, 'required package documents are missing'
          def inspect(value):
              if isinstance(value, dict):
                  for child in value.values():
                      inspect(child)
              elif isinstance(value, list):
                  for child in value:
                      inspect(child)
              elif isinstance(value, str) and value.startswith('./'):
                  assert value[2:] in paths, f'missing exported file: {value}'
          inspect(packed.get('exports', {}))
          inspect(packed.get('imports', {}))
          for field in ('main', 'types'):
              assert packed[field].removeprefix('./') in paths, f'missing {field} entry point'
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          Path('artifacts/SHA256SUMS').write_text(f'{digest}  package.tgz\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"version={packed['version']}\n")
          print(f"Inspected {packed['name']}@{packed['version']}: {len(paths)} files; SHA-256 {digest}")
          PYTHON
      - name: Verify the inspected archive checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Refuse a package whose changelog is not stamped for its version
        id: changelog
        env:
          VERSION: ${{ steps.inspect.outputs.version }}
        shell: bash
        run: |
          python3 -I - artifacts/package.tgz "$VERSION" <<'PY'
          import io, re, sys, tarfile
          archive, version = sys.argv[1], sys.argv[2]
          def refuse(message):
              raise SystemExit(f'{archive}: {message}; publication refused')
          with tarfile.open(archive, 'r:*') as outer:
              if 'contents.tar.gz' in outer.getnames():
                  package = tarfile.open(fileobj=io.BytesIO(outer.extractfile('contents.tar.gz').read()), mode='r:gz')
                  root = ''
              else:
                  package, root = outer, 'package/'
              found = [member for member in package.getmembers() if member.isfile()
                       and re.fullmatch(re.escape(root) + r'(?i:changelog(?:\.md|\.markdown|\.txt)?)', member.name)]
              if len(found) != 1:
                  refuse('the package must ship exactly one root CHANGELOG')
              try:
                  lines = package.extractfile(found[0]).read().decode('utf-8').splitlines()
              except UnicodeDecodeError:
                  refuse('the packaged CHANGELOG is not UTF-8')
          headings, fence = {}, False
          for index, line in enumerate(lines):
              if re.match(r' {0,3}(```|~~~)', line):
                  fence = not fence
              elif not fence and (match := re.match(r' {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$', line)):
                  headings[index] = (len(match.group(1)), match.group(2) or '')
          token = re.compile(r'(?<![0-9A-Za-z.+-])v?' + re.escape(version) + r'(?![0-9A-Za-z.+-])')
          stamped = [index for index, (_, title) in headings.items() if token.search(title)]
          if not stamped:
              refuse(f'the packaged CHANGELOG has no section for {version}')
          at, level = stamped[0], headings[stamped[0]][0]
          def written(start):
              end = next((index for index, (depth, _) in headings.items() if index > start and depth <= level), len(lines))
              return any(line.strip() for index, line in enumerate(lines[start + 1:end], start + 1) if index not in headings)
          if not written(at):
              refuse(f'the packaged CHANGELOG section for {version} is empty')
          for start, (depth, title) in headings.items():
              if start < at and depth == level and written(start):
                  refuse(f'the packaged CHANGELOG has entries above {version}, under "{title}"')
          print(f'{archive}: the packaged CHANGELOG is stamped for {version}')
          PY
      - name: Decide whether the inspected bytes need staging
        id: registry
        run: node --experimental-strip-types --no-warnings scripts/registry-check.ts plan
      - name: Stage the inspected archive with trusted publishing
        if: steps.registry.outputs.action == 'stage'
        # Trusted publishing uses OIDC; no registry key reaches project code.
        # A pending stage reserves the version. npm refuses a duplicate; never reject or replace it.
        run: npm stage publish ./artifacts/package.tgz --provenance --ignore-scripts
      - name: Read the public package back without a key
        id: readback
        run: node --experimental-strip-types --no-warnings scripts/registry-check.ts read-back
      - name: Retain all release files for the versioned GitHub release
        if: always() && steps.inspect.outcome == 'success' && steps.changelog.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
  published-package:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
    steps:
      - name: Refuse a ref outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
      - name: Require public read-back before checking a registry install
        env:
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          test "$PUBLISHED" = true || { echo "::error::Release is held for npm approval. Approve on npmjs.com and dispatch this same commit again for read-back."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read exact tool versions
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: Refuse a different Python version
        env:
          EXPECTED_PYTHON: ${{ steps.versions.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - name: Read the declared package manager
        id: manager
        run: python3 -I -B scripts/package-manager.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          package-manager-cache: false
      - name: Refuse a different Node version
        env:
          EXPECTED_NODE: ${{ steps.versions.outputs.nodejs }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"
      - name: Install the declared package manager
        env:
          EXPECTED_NPM: ${{ steps.manager.outputs.npm }}
        run: |
          npm install --global "npm@$EXPECTED_NPM" --ignore-scripts
          test "$(npm --version)" = "$EXPECTED_NPM"
      - name: Install and verify the published version in a fresh consumer
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          consumer="$(mktemp -d "$RUNNER_TEMP/request-seal-consumer-XXXXXX")"
          trap 'rm -rf "$consumer"' EXIT
          cd "$consumer"
          printf '{"private":true,"type":"module","packageManager":"npm@%s"}\n' "$(npm --version)" > package.json
          npm install --ignore-scripts --registry=https://registry.npmjs.org/ "$package_name@$package_version"
          npm audit signatures --registry=https://registry.npmjs.org/
          EXPECTED_VERSION="$package_version" node --input-type=module <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import {VERSION, byteString} from '@request-seal/core';
          import metadata from '@request-seal/core/package.json' with {type: 'json'};
          assert.equal(VERSION, process.env.EXPECTED_VERSION);
          assert.equal(metadata.version, process.env.EXPECTED_VERSION);
          assert.deepEqual(byteString('abc').value, new Uint8Array([97, 98, 99]));
          for (const subpath of Object.keys(metadata.exports).filter(path => path !== '.' && path !== './package.json')) {
            await import('@request-seal/core/' + subpath.slice(2));
          }
          JAVASCRIPT
