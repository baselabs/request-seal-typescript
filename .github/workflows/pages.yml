name: Pages
on:
  workflow_dispatch:

permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    environment: github-pages
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    timeout-minutes: 5 # Run 43666140389: cold build job 20s; no cache restored.
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a ref outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read exact tool versions
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: Refuse a different Python version
        env:
          EXPECTED_PYTHON: ${{ steps.versions.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - name: Read the declared package manager
        id: manager
        run: python3 -I -B scripts/package-manager.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          package-manager-cache: false
      - name: Refuse a different Node version
        env:
          EXPECTED_NODE: ${{ steps.versions.outputs.nodejs }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"
      - name: Install the declared package manager
        env:
          EXPECTED_NPM: ${{ steps.manager.outputs.npm }}
        run: |
          npm install --global "npm@$EXPECTED_NPM" --ignore-scripts
          test "$(npm --version)" = "$EXPECTED_NPM"
      - run: npm ci --ignore-scripts
      - run: npm run docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-dist
  deploy:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    timeout-minutes: 5 # Run 43813493989: cold deploy job 14s; no cache restored.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a ref outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
      - name: Deploy API reference
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
